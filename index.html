<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0a2e22" />
<title>斗地主 · 联机版</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🃏</text></svg>" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="app">

  <!-- ============ 首页 ============ -->
  <section class="screen" id="scr-home">
    <div class="home">
      <h1 class="logo">斗地主</h1>
      <p class="sub">联机版 · 三人对战 · 无需注册</p>

      <label class="field">
        <span>昵称</span>
        <input id="in-name" maxlength="8" placeholder="给自己起个名字" autocomplete="off" />
      </label>
      <button class="btn primary block" id="btn-create">创建房间</button>

      <div class="divider"><span>或者加入好友的房间</span></div>

      <label class="field">
        <span>房号</span>
        <input id="in-code" maxlength="4" placeholder="4 位房号" autocomplete="off" autocapitalize="characters" />
      </label>
      <button class="btn block" id="btn-join">加入房间</button>

      <p class="tip">先创建房间拿到房号，把房号发给两位朋友，他们输入房号即可入座。凑满 3 人由房主开局。</p>
    </div>
  </section>

  <!-- ============ 房间 ============ -->
  <section class="screen hidden" id="scr-lobby">
    <div class="lobby">
      <div class="code-badge">房号 <b id="lobby-code">----</b></div>
      <ul class="seat-list" id="seat-list"></ul>
      <button class="btn primary block" id="btn-start" disabled>开始游戏</button>
      <p class="tip" id="lobby-tip"></p>
      <button class="btn ghost block" id="btn-leave">离开房间</button>
    </div>
  </section>

  <!-- ============ 牌桌 ============ -->
  <section class="screen hidden" id="scr-table">
    <div class="table">
      <header class="topbar">
        <span class="pill">房号 <b id="t-code">----</b></span>
        <span class="pill">底分 <b id="t-base">-</b> · 倍数 <b id="t-mult">x1</b></span>
        <button class="btn tiny ghost" id="btn-quit">退出</button>
      </header>

      <div class="bottom-row">
        <span class="btm-label">底牌</span>
        <div class="bottom-cards" id="t-bottom"></div>
      </div>

      <div class="board">
        <div class="seat-panel left" id="seat-left"></div>
        <div class="seat-panel right" id="seat-right"></div>
      </div>

      <div class="my-play" id="my-play"></div>

      <div class="myarea" id="myarea">
        <div class="my-info" id="my-info"></div>
        <div class="hand" id="hand"></div>
        <div class="actions" id="actions"></div>
      </div>

      <div class="overlay hidden" id="overlay">
        <div class="panel" id="overlay-panel"></div>
      </div>
    </div>
  </section>

</div>
<div class="toast" id="toast"></div>

<script src="js/vendor/peerjs.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
